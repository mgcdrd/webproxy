---
# ============================================================
# webproxy — nginx + keepalived reverse proxy cluster
#
# Two-node active/passive nginx cluster with a floating VIP.
# ssl_scripting (self-signed certs) is the default SSL provider —
# switch nginx_ssl_provider to acme_sh once a real domain/DNS
# record is ready for production certs.
#
# No nginx_server_blocks are defined by default — see
# inventory/group_vars/all/main.yml and README.md for how to add
# a real one (in the instance's group_vars) once there's a backend to
# proxy to.
#
# Usage:
#   ansible-galaxy collection install -r collections/requirements.yml
#   DEPLOY_INSTANCE=<name> ansible-playbook site.yml
# ============================================================

# Fails unless exactly one webproxy instance is loaded (set
# DEPLOY_INSTANCE=<name>, see ansible.cfg). Tagged always so
# --tags runs still get checked.
- name: Webproxy - Instance guard
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  roles:
    - role: mgcdrd.infrabase.instance_guard
      vars:
        instance_guard_group: webproxy

- name: Webproxy - sudoers
  hosts: webproxy
  become: true
  gather_facts: false
  roles:
    # Skipped entirely with no sudoers_rules set (default) -- opt-in, for
    # the devops proxy-files service account's nginx -t/-s reload grant.
    # See inventory/group_vars/all/main.yml and mgcdrd.infrabase.sudoers's
    # README, "Per-user/group sudo grants".
    - role: mgcdrd.infrabase.sudoers
      when: sudoers_rules | default([]) | length > 0


- name: Webproxy - nginx
  hosts: webproxy
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrasvc.nginx


- name: Webproxy - keepalived
  hosts: webproxy
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrasvc.keepalived
