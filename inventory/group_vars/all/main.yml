---

# ===========================================================================
# nginx
# ===========================================================================

# SSL: ssl_scripting (self-signed) or acme_sh (real DNS-validated certs) —
# mgcdrd.infrasvc.nginx calls whichever role nginx_ssl_provider names.
# ssl_scripting is the default (safe out of the box, no external
# dependency). Switch to acme_sh once a real domain/DNS record exists for
# this cluster's VIP: comment out the ssl_scripting block below and
# uncomment the acme_sh one.
nginx_ssl_enable: true
nginx_ssl_provider: ssl_scripting

nginx_ssl_scripting:
  base_dir: /etc/nginx/ssl_scripting

# --- acme_sh alternative (production certs via PowerDNS DNS-01) -----------
# nginx_ssl_provider: acme_sh
#
# acme_sh_email:        "{{ vault_acme_email }}"
# acme_sh_ca:            letsencrypt
# acme_sh_pdns_url:      "http://dns.{{ domain }}:8081"
# acme_sh_pdns_token:    "{{ vault_pdns_api_key }}"
# # Flat <domain>.crt/.key symlinks (all domains, every cert) for the
# # $ssl_server_name lookup in nginx_shared_configs.ssl below.
# acme_sh_flat_ssl_dir:  /etc/nginx/ssl
#
# # One entry per FQDN this cluster proxies — add a new one whenever a new
# # site is added, no nginx_shared_configs/role changes needed. A cert can
# # cover multiple domains (SANs); every domain on it still gets its own
# # <domain>.crt/.key symlink, so nginx_server_blocks can list either one.
# #
# # reload_cmd pushes to Vault first (acme-sh-vault-push.sh, deployed by
# # acme_sh on the issuer only) so a cron-triggered renewal updates Vault
# # even when no Ansible run is involved — see acme_sh_vault_kv_enabled below.
# acme_sh_certs:
#   - domains:
#       - "app1.{{ domain }}"
#       - "app2.{{ domain }}"    # SAN on the same cert as app1
#     challenge: dns_pdns
#     reload_cmd: "/usr/local/sbin/acme-sh-vault-push.sh app1.{{ domain }} && systemctl reload nginx"
#   - domains:
#       - "app3.{{ domain }}"    # separate cert, own domains list
#     challenge: dns_pdns
#     reload_cmd: "/usr/local/sbin/acme-sh-vault-push.sh app3.{{ domain }} && systemctl reload nginx"
#
# vault_acme_email / vault_pdns_api_key: copy inventory/group_vars/all/vault.yml.example
# to vault.yml (gitignored). dns_cf is also available instead of dns_pdns —
# see mgcdrd.infrabase.acme_sh's own defaults/main.yml for the full acme_sh_*
# variable set.
#
# --- issuer + Vault fan-out ------------------------------------------------
# With 2+ webproxy nodes each issuing the same domain set independently,
# every renewal cycle burns against Let's Encrypt's 5-duplicate-certs/week
# limit once per node instead of once total. Centralize issuance on one
# node and fan the result out to the rest via Vault — see
# mgcdrd.infrabase.acme_sh's README "ISSUER + VAULT FAN-OUT" section.
#
# acme_sh_issuer_host: proxy1.example.com   # literal hostname — never
#                                            # groups.webproxy | first, since
#                                            # inventory reordering must
#                                            # never silently move who issues
# acme_sh_vault_kv_enabled: true
# acme_sh_vault_kv_mount: "{{ vault_kv_infra_mount }}"
# acme_sh_vault_kv_path_prefix: "{{ vault_kv_env }}/webproxy/certs"
# acme_sh_vault_deploy_reload_cmd: "systemctl reload nginx"

# No server blocks defined yet — this deployment stands up the proxy
# infrastructure (nginx + keepalived VIP + SSL), not any specific site.
# Add real entries here once there's a backend to proxy to, e.g.:
#
# nginx_server_blocks:
#   - name: example-app
#     server_names:
#       - app.example.com
#     exclude_proxy_files: false
#     proxy_files_path: /etc/nginx/conf.d/example-app.proxies   # deploy this file separately —
#                                                                # the role doesn't manage proxy_pass content
nginx_server_blocks: []

nginx_http_block:
  add_mime: true
  force_80_redirect: true
  hsts_max_age: 63072000
  block_badagents: false
  gzip_comp_lvl: 6
  gzip_buffers: "4 8k"
  client_body_buffer_size: 1k
  client_header_buffer_size: 8k
  large_client_header_buffers: "4 8k"
  # default_443 gives nginx a valid catch-all cert to bind to on :443 so it
  # doesn't fail to start before any real server_blocks are defined.
  default_443:
    enabled: true

# Ships a copy of every server block's access/error log to the central
# syslog server (syslog.lab.provenzawt.dev, local6 bucket) for long-term
# retention — separate from and in addition to the existing nginx->Loki
# path via grafana_alloy (dashboards/live search, short retention). Only
# takes effect once nginx_server_blocks above is non-empty — shared_configs
# are included per server block, and none exist yet.
nginx_shared_configs:
  # ssl: (uncomment alongside the acme_sh block above) lets every server
  # block share this one config while nginx resolves a different cert per
  # connection off the SNI hostname — needs acme_sh_flat_ssl_dir set to the
  # same directory so the <domain>.crt/.key files it references exist.
  # ssl:
  #   ssl_cert_path: '/etc/nginx/ssl/$ssl_server_name.crt'
  #   ssl_key_path:  '/etc/nginx/ssl/$ssl_server_name.key'
  logging:
    - type:   access_log
      path:   "syslog:server=unix:/dev/log,facility=local6,tag=nginx_access"
      format: main
    - type:   error_log
      path:   "syslog:server=unix:/dev/log,facility=local6,tag=nginx_error"
      format: warn


# ===========================================================================
# keepalived
# ===========================================================================

keepalived_vip_for:
  - webproxy

keepalived_vrrp_instances:
  - name: VI_WEBPROXY
    master_node: proxy1.example.com
    backup_nodes:
      - proxy2.example.com
    # Placeholder — must be a real, free IP on this cluster's network
    # before first run. Update once real hostnames/network are known.
    virt_ip:
      - 192.168.1.50/24
